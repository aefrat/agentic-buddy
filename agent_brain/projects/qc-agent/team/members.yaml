# Quarterly Connection Agent — Team Configuration
# ------------------------------------------------
# Manager-maintained. Update when team composition changes.
#
# Fields:
#   id                       — unique identifier (used for filenames)
#   display_name             — full name shown in the report
#   title                    — job title
#   team                     — team name
#   jira_display_name        — name as it appears in Jira assignee field
#   jira_project_jql         — JQL fragment for the team's Jira project
#   gitlab_cee_username      — username on gitlab.cee.redhat.com
#   gitlab_com_username      — username on gitlab.com
#   github_username          — username on github.com (optional)
# ------------------------------------------------

teams:
